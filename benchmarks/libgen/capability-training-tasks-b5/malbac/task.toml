schema_version = "1.3"
artifacts = [
  { source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" },
  { source = "/logs/network/provider-egress.jsonl", destination = "provider_egress.jsonl", service = "provider-egress" }
]

[task]
name = "sequencing/libgen-malbac"
description = "Reconstruct linked oligos and molecular library generation for MALBAC."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "4.1.0"
protocol_id = "malbac"
protocol_name = "MALBAC"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "docker-provider-only"
source_delivery = "embedded"
network_policy_sha256 = "d9aaaa853d953b4eee1e2116d8b3ee7c705babcb0ab5fd7231852dea7b4df411"
source_manifest_sha256 = "2f040a0f0a085c7ae5c241ec96d308186e131bb68c979876256fc13150e68602"
groundtruth_source_bundle_sha256 = "0d6d82cb9b3ac185d242f46436ac420429f196ed2714e879f553b63af7674572"
groundtruth_bundle_sha256 = "dbc2ed0eda7e5989225ff1972c9c95d17135cce09d27cb9e03eece09e28fd4eb"
groundtruth_transform = "legacy_workflow_terminal_contract_to_final_outputs_v1"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "malbac"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN:-}"
