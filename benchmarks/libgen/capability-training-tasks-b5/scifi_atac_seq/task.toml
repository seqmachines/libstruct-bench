schema_version = "1.3"
artifacts = [
  { source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" },
  { source = "/logs/network/provider-egress.jsonl", destination = "provider_egress.jsonl", service = "provider-egress" }
]

[task]
name = "sequencing/libgen-scifi_atac_seq"
description = "Reconstruct linked oligos and molecular library generation for sci-fi ATAC-seq."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "4.1.0"
protocol_id = "scifi_atac_seq"
protocol_name = "sci-fi ATAC-seq"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "docker-provider-only"
source_delivery = "embedded"
network_policy_sha256 = "d9aaaa853d953b4eee1e2116d8b3ee7c705babcb0ab5fd7231852dea7b4df411"
source_manifest_sha256 = "057c66ea21841a13614c3137bde36f52f987d81aa16ccbf9a6288065f04ce9c3"
groundtruth_source_bundle_sha256 = "a8d0dc9809596398a224e5312c763b16548a93991fd8300838e8abe90403e789"
groundtruth_bundle_sha256 = "d9d413922ab3c16e6e6b93c0b0e2ddecc6a2e98c1ee7e7bdec7ffc0a081e1761"
groundtruth_transform = "legacy_workflow_terminal_contract_to_final_outputs_v1"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "scifi_atac_seq"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN:-}"
