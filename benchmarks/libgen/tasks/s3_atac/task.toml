schema_version = "1.3"
artifacts = [{ source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" }]

[task]
name = "sequencing/libgen-s3_atac"
description = "Reconstruct linked oligos and molecular library generation for s3-ATAC."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "3.0.0"
protocol_id = "s3_atac"
protocol_name = "s3-ATAC"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "local-docker"
source_manifest_sha256 = "05fbbee5f272028ef50d44a0dede4ee11a1fdf12fdc9852f0314d0458dd58bda"
groundtruth_bundle_sha256 = "1acaba38b171383c5eeb6d9f4bff635b866949c6ffd43f39a45b34d824114ca8"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "s3_atac"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
