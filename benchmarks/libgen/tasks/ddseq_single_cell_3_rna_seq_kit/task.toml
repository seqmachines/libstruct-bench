schema_version = "1.3"
artifacts = [{ source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" }]

[task]
name = "sequencing/libgen-ddseq_single_cell_3_rna_seq_kit"
description = "Reconstruct linked oligos and molecular library generation for ddSEQ Single-Cell 3' RNA-Seq Kit."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "3.0.0"
protocol_id = "ddseq_single_cell_3_rna_seq_kit"
protocol_name = "ddSEQ Single-Cell 3' RNA-Seq Kit"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "docker-provider-only"
network_policy_sha256 = "2a2716acf651b01926545ba2f4b741be342497d184a9a7935ee6ea45c1deabad"
source_manifest_sha256 = "43f08373a69d0635b23ae10bd3d6310e632388122993b065ea0ff659986182f4"
groundtruth_bundle_sha256 = "01baa0b85a63d6d220adec93d8ef292b6eff810fa96e33cc69e7e2be933ecf1a"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "ddseq_single_cell_3_rna_seq_kit"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
