schema_version = "1.3"
artifacts = [{ source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" }]

[task]
name = "sequencing/libgen-seq_well_s3"
description = "Reconstruct linked oligos and molecular library generation for Seq-Well S3."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "3.0.0"
protocol_id = "seq_well_s3"
protocol_name = "Seq-Well S3"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "docker-provider-only"
network_policy_sha256 = "2a2716acf651b01926545ba2f4b741be342497d184a9a7935ee6ea45c1deabad"
source_manifest_sha256 = "9c10fa3d0ccb54f1515a9f1375278b0b43159f135d595b898795e0abcb547c0a"
groundtruth_bundle_sha256 = "e8e6201cfb177212a3a0a7d3f4624e81e9762bea61f60d51f0524e94083a43eb"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "seq_well_s3"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
