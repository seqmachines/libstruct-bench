schema_version = "1.3"
artifacts = [{ source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" }]

[task]
name = "sequencing/libgen-pip_seq_v4"
description = "Reconstruct linked oligos and molecular library generation for PIP-seq v4."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "3.0.0"
protocol_id = "pip_seq_v4"
protocol_name = "PIP-seq v4"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "local-docker"
source_manifest_sha256 = "03894ee65c786cd68376337de7a577fa7a54d4a72cf0fe2d9861061573f97c56"
groundtruth_bundle_sha256 = "2ebf1788d549b7d0744cd1911b4c78b528c3571fcbb7453029504e668f8ba6ea"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "pip_seq_v4"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
