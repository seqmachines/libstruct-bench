schema_version = "1.3"
artifacts = [{ source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" }]

[task]
name = "sequencing/libgen-smart_seq"
description = "Reconstruct linked oligos and molecular library generation for SMART-seq."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "2.0.0"
protocol_id = "smart_seq"
protocol_name = "SMART-seq"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "ecd12f41611ed64e3bff53d715b111e0f0ee9a10"
network_profile = "local-docker"
source_manifest_sha256 = "dac4fe5d4c93afb036a25da22c78f27f48ba91b659c35b3e926e0ad79a6aeecb"
groundtruth_bundle_sha256 = "cb2db933a4308cb4ccdfaa5031c27e16e08a7005093709c6609fc7f09687d860"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "smart_seq"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
