schema_version = "1.3"

[task]
name = "sequencing/libgen-petri_seq"
description = "Reconstruct linked oligos and molecular library generation for PETRI-seq."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
protocol_id = "petri_seq"
protocol_name = "PETRI-seq"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "ecd12f41611ed64e3bff53d715b111e0f0ee9a10"
network_profile = "local-docker"
source_manifest_sha256 = "6c72ee434d814a1ce14b84aa8dc321222b56ca2d9e9122d4121b86dc2aed92a6"
groundtruth_bundle_sha256 = "ff7eb24fc75374fd714a89c5124105edcac67a247d74a417f1bdfcb61547a0ac"

[agent]
timeout_sec = 1800.0

[agent.env]
LIBGEN_PROTOCOL_ID = "petri_seq"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
