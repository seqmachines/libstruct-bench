schema_version = "1.3"

[task]
name = "sequencing/libgen-dr_seq"
description = "Reconstruct linked oligos and molecular library generation for DR-seq."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
protocol_id = "dr_seq"
protocol_name = "DR-seq"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "ecd12f41611ed64e3bff53d715b111e0f0ee9a10"
network_profile = "local-docker"
source_manifest_sha256 = "18c1af60111984f83d0bbb644e585f45fc472d94e2da78e2084dbe4acb9ce86a"
groundtruth_bundle_sha256 = "76d3ed7ac0abf0c6d9e571da5b9803b5f1addd3527ef449cd326d8e482757645"

[agent]
timeout_sec = 1800.0

[agent.env]
LIBGEN_PROTOCOL_ID = "dr_seq"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
