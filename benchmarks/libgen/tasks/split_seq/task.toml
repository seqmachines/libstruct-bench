schema_version = "1.3"
artifacts = [{ source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" }]

[task]
name = "sequencing/libgen-split_seq"
description = "Reconstruct linked oligos and molecular library generation for SPLiT-seq."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "3.0.0"
protocol_id = "split_seq"
protocol_name = "SPLiT-seq"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "local-docker"
source_manifest_sha256 = "481bc4d1499307e2680c3654ee1b3d9ee8104863817acb1b375db099bfaed488"
groundtruth_bundle_sha256 = "fd5021521bd429c081754ce0b07d5cd29e3e82b62ee842bec7de9e03376e09f9"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "split_seq"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
