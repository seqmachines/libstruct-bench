schema_version = "1.3"
artifacts = [
  { source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" },
  { source = "/logs/network/provider-egress.jsonl", destination = "provider_egress.jsonl", service = "provider-egress" }
]

[task]
name = "sequencing/libgen-microwell_seq"
description = "Reconstruct linked oligos and molecular library generation for Microwell-seq."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "4.5.0"
protocol_id = "microwell_seq"
protocol_name = "Microwell-seq"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "docker-provider-only"
source_delivery = "pinned-hf"
network_policy_sha256 = "d9aaaa853d953b4eee1e2116d8b3ee7c705babcb0ab5fd7231852dea7b4df411"
source_manifest_sha256 = "4eedb71f2ea2e70cd9ced82793e4ae7ca209ec3c0c0508531f7bf0b6ad2212f8"
groundtruth_source_bundle_sha256 = "f5116b105a36ebadd90ea1c639b31a583ff2eaa81509eb73e9accbdd3e6a6431"
groundtruth_bundle_sha256 = "f5116b105a36ebadd90ea1c639b31a583ff2eaa81509eb73e9accbdd3e6a6431"
groundtruth_transform = "none"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "microwell_seq"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN:-}"
