schema_version = "1.3"
artifacts = [{ source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" }]

[task]
name = "sequencing/libgen-10x_chromium_3_feature_barcoding"
description = "Reconstruct linked oligos and molecular library generation for 10x Chromium 3' Feature Barcoding."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "3.0.0"
protocol_id = "10x_chromium_3_feature_barcoding"
protocol_name = "10x Chromium 3' Feature Barcoding"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "local-docker"
source_manifest_sha256 = "d7032f109c3a28e94ba70502428574cdec7d6aa08c894bb7ffff4189694dd619"
groundtruth_bundle_sha256 = "06b361f1574e78d6cbc66a7ad6ea108526c81089cd3dfa61b391cb2469bc5da2"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "10x_chromium_3_feature_barcoding"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
