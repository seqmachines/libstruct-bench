schema_version = "1.3"

[task]
name = "sequencing/libgen-scdamid"
description = "Reconstruct linked oligos and molecular library generation for scDamID."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
protocol_id = "scdamid"
protocol_name = "scDamID"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "ecd12f41611ed64e3bff53d715b111e0f0ee9a10"
network_profile = "local-docker"
source_manifest_sha256 = "87b9dd232997e75630415bf26ad50bb61c4c190952f0a386fd13095e39fe1d79"
groundtruth_bundle_sha256 = "52c53edb0b771f9879101196b51f1d229759eca34cb8d5f7c599ee9ed5664124"

[agent]
timeout_sec = 1800.0

[agent.env]
LIBGEN_PROTOCOL_ID = "scdamid"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
