schema_version = "1.3"
artifacts = [
  { source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" },
  { source = "/logs/network/provider-egress.jsonl", destination = "provider_egress.jsonl", service = "provider-egress" }
]

[task]
name = "sequencing/libgen-scrrbs"
description = "Reconstruct linked oligos and molecular library generation for scRRBS."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "3.0.0"
protocol_id = "scrrbs"
protocol_name = "scRRBS"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "docker-provider-only"
network_policy_sha256 = "d9aaaa853d953b4eee1e2116d8b3ee7c705babcb0ab5fd7231852dea7b4df411"
source_manifest_sha256 = "f338809a5e443899b2a4f42add14ba2cd83569a5518cb7c6afef0d3480836333"
groundtruth_bundle_sha256 = "67fe746492170048c0269250090ad78c054e440731351357d73cd0212262e4d1"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "scrrbs"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN:-}"
