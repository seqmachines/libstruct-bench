schema_version = "1.3"
artifacts = [
  { source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" },
  { source = "/logs/network/provider-egress.jsonl", destination = "provider_egress.jsonl", service = "provider-egress" }
]

[task]
name = "sequencing/libgen-crispr_sciatac"
description = "Reconstruct linked oligos and molecular library generation for CRISPR-sciATAC."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "4.1.0"
protocol_id = "crispr_sciatac"
protocol_name = "CRISPR-sciATAC"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "docker-provider-only"
source_delivery = "embedded"
network_policy_sha256 = "d9aaaa853d953b4eee1e2116d8b3ee7c705babcb0ab5fd7231852dea7b4df411"
source_manifest_sha256 = "a5c33d081018ad483124224da3d24fc2443411fee86f4e5f0e55abaaad88c3e6"
groundtruth_source_bundle_sha256 = "3b2e1de39f0db6f1658f9802f6ea518271a2d30a2b0f0f48be7ec0c402f425a2"
groundtruth_bundle_sha256 = "c2088f3ebe7ce369abb3d2ebc7777ef11448399e1dd856137043367abd27c092"
groundtruth_transform = "legacy_workflow_terminal_contract_to_final_outputs_v1"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "crispr_sciatac"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN:-}"
