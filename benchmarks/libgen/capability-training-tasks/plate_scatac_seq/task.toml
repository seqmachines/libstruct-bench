schema_version = "1.3"
artifacts = [
  { source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" },
  { source = "/logs/network/provider-egress.jsonl", destination = "provider_egress.jsonl", service = "provider-egress" }
]

[task]
name = "sequencing/libgen-plate_scatac_seq"
description = "Reconstruct linked oligos and molecular library generation for Plate scATAC-seq."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "4.1.0"
protocol_id = "plate_scatac_seq"
protocol_name = "Plate scATAC-seq"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "docker-provider-only"
source_delivery = "embedded"
network_policy_sha256 = "d9aaaa853d953b4eee1e2116d8b3ee7c705babcb0ab5fd7231852dea7b4df411"
source_manifest_sha256 = "99f268d1d112a337890164785f2f46afd7969de082f1e75244a9c149a1d1fb34"
groundtruth_source_bundle_sha256 = "e9d2e0c14cb700a4540791741cce8bb37c92f5e1cf064653caf70f4680c18aaf"
groundtruth_bundle_sha256 = "99e0fac721cbd0a5486344f576e1091f0f9c1508b61465620fe992027cff7f11"
groundtruth_transform = "legacy_workflow_terminal_contract_to_final_outputs_v1"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "plate_scatac_seq"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN:-}"
