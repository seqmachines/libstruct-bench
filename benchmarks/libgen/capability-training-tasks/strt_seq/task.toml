schema_version = "1.3"
artifacts = [
  { source = "/logs/agent/trajectory.json", destination = "agent_trajectory.json" },
  { source = "/logs/network/provider-egress.jsonl", destination = "provider_egress.jsonl", service = "provider-egress" }
]

[task]
name = "sequencing/libgen-strt_seq"
description = "Reconstruct linked oligos and molecular library generation for STRT-seq."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "molecular-workflow", "protocol-understanding"]

[metadata]
benchmark = "libgen"
benchmark_version = "4.1.0"
protocol_id = "strt_seq"
protocol_name = "STRT-seq"
input_repo = "sequencing/scg-protocols-v1"
input_revision = "19c29caabcb019a72d08fed59ed8030a2d3c449d"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
groundtruth_revision = "5a81714daaa87d568a0c5b62320679d34219ebf7"
network_profile = "docker-provider-only"
source_delivery = "embedded"
network_policy_sha256 = "d9aaaa853d953b4eee1e2116d8b3ee7c705babcb0ab5fd7231852dea7b4df411"
source_manifest_sha256 = "d957855bfc571674ec4db676f3125f0da48c747533f5349d42fca8730cdef602"
groundtruth_source_bundle_sha256 = "c7c0e76481fcd77563dd13386f7c473de34665bc49c4488f36ce5e720b5691a3"
groundtruth_bundle_sha256 = "ac361224021cb5a705e5438ed2ec2ab1c08f21db221ec00828012d0c1ca31fe7"
groundtruth_transform = "legacy_workflow_terminal_contract_to_final_outputs_v1"

[agent]
timeout_sec = 3600.0

[agent.env]
LIBGEN_PROTOCOL_ID = "strt_seq"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 16384

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN:-}"
