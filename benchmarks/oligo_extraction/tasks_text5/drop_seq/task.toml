  "drop_seq/drop-seq_supp.pymupdf_text.txt",
  "drop_seq/drop-seq_paper.pypdf_text.txt",
  "drop_seq/drop-seq_supp.pypdf_text.txt",
  "drop_seq/drop-seq_paper.docling_text.txt",
  "drop_seq/drop-seq_supp.docling_text.txt",
]
