schema_version = "1.3"
artifacts = ["/logs/artifacts/prediction.json"]

[task]
name = "sequencing/oligo-extraction-scdamid"
description = "Extract oligo names and sequences for scDamID."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "extraction", "benchmark"]

[metadata]
benchmark = "oligo_extraction_v1"
protocol_id = "scdamid"
protocol_name = "scDamID"
input_repo = "sequencing/scg-protocols-v1"
groundtruth_repo = "sequencing/scg-oligo-groundtruth-v1"
input_revision = "59f49763dc258db15d754ba6504b5cacd3404e94"
groundtruth_revision = "d6afef738330f35e40e10fde68fad850a7ccc8fd"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[environment]
docker_image = "python:3.12-slim"
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
