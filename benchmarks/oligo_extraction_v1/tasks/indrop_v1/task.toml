schema_version = "1.3"
artifacts = ["/logs/artifacts/prediction.json"]

[task]
name = "seqmachines/oligo-extraction-indrop_v1"
description = "Extract oligo names and sequences for inDrop v1."
authors = [{ name = "Seq Machines" }]
keywords = ["genomics", "oligo", "extraction", "benchmark"]

[metadata]
benchmark = "oligo_extraction_v1"
protocol_id = "indrop_v1"
protocol_name = "inDrop v1"
input_repo = "seqmachines/scg-protocols-v1"
groundtruth_repo = "seqmachines/scg-oligo-groundtruth-v1"
input_revision = "6eb000e1e438104ecbda2124a5513a185fefd7e6"
groundtruth_revision = "d6afef738330f35e40e10fde68fad850a7ccc8fd"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[environment]
docker_image = "python:3.12-slim"
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier.environment.env]
HF_TOKEN = "${HF_TOKEN}"
